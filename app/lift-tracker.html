  // logging at all. RIR is on the same run rather than a separate pass because you know
  // how many you had left at the moment you finish the set, not ten minutes later.
  const advance = (el) => {
    const boxes = $$("[data-r], [data-rir]");
    const next = boxes[boxes.indexOf(el) + 1];
    el.blur();
    if (next) { next.focus(); next.select(); }
  };

  digitBox("r", "reps", 2, MAX_REPS);
  digitBox("rir", "rir", 1, MAX_RIR);
}

// ---- Add-exercise dialog ---------------------------------------------------
//
// Picking a movement used to be the whole decision, and the sets fell out of the library
// row. A scheme is a second decision that can't be defaulted away -- five sets waving up
// to a double is a different session from three sets of eight -- so it gets asked, once,
// at the point of adding. The dialog previews what it will create by calling the same
// planSets() that creates it, so there is no second description of a scheme to keep in
// step with the first.
const addDraft = { date: null, exerciseId: null, scheme: "static", sets: 3, reps: 8, weight: "" };

function openAddExercise(date, exerciseId) {
  const ex = exerciseById(exerciseId);
  if (!ex) return;
  addDraft.date = date;
  addDraft.exerciseId = exerciseId;
  addDraft.scheme = "static";
  // All three default to "what you did last time", the same rule the weight suggestion
  // follows elsewhere: the library's set count, the rep target and the weight of the last
  // session -- or the library's own max weight for a movement with no history yet.
  addDraft.sets = Math.max(1, Math.min(MAX_SCHEME_SETS, num(ex.defaultSets, 3)));
  addDraft.reps = suggestTargetReps(exerciseId, date);
  addDraft.weight = fmtWeight(suggestWeight(exerciseId, date, 0));
  renderAddExercise();
}

function closeAddExercise() {
  const modal = $("#add-modal");
  modal.hidden = true;
  modal.innerHTML = "";
}

function renderAddExercise() {
  const ex = exerciseById(addDraft.exerciseId);
  if (!ex) return closeAddExercise();
  const modal = $("#add-modal");
  const wasFocused = document.activeElement?.dataset?.addField;
  const caret = document.activeElement?.selectionStart;
  const isPeak = addDraft.scheme === "peak";
  const rows = planSets(ex, addDraft.date, addDraft);
  const max = estimatedOneRepMax(ex);

  modal.hidden = false;
  modal.innerHTML = `<div class="fb-box" style="width:min(400px,100%)">
    <h3>Add ${esc(ex.name)}</h3>
    <p style="font-size:.75rem;color:var(--muted);margin:.1rem 0 .5rem">
      ${esc(fmtDate(addDraft.date))} · max weight ${esc(fmtWeight(max))} ${esc(ex.unit || "lb")}
      · 1 pip = ${esc(fmtPip(max))} ${esc(ex.unit || "lb")}</p>
    <div class="seg" id="add-seg">
      <button data-scheme="static"${isPeak ? "" : ' class="active"'}>
        <span class="t">Static</span><span class="d">Same reps, same weight</span></button>
      <button data-scheme="peak"${isPeak ? ' class="active"' : ""}>
        <span class="t">Peak</span><span class="d">5·4·2·4·5 off the max</span></button>
    </div>
    ${isPeak ? "" : `<div class="add-fields">
      <label class="field">Weight (${esc(ex.unit || "lb")})
        <input type="text" inputmode="decimal" style="width:4.6rem" data-add-field="weight"
               value="${esc(addDraft.weight)}"></label>
      <label class="field">Sets
        <input type="text" inputmode="numeric" maxlength="1" data-add-field="sets"
               value="${esc(addDraft.sets)}"></label>
      <label class="field">Reps
        <input type="text" inputmode="numeric" maxlength="2" data-add-field="reps"
               value="${esc(addDraft.reps)}"></label>
    </div>`}
    <div class="add-preview">
      <div class="hd">${rows.length} set${rows.length === 1 ? "" : "s"}</div>
      <ol>${rows.map((r, i) => `<li><span class="i">${i + 1}</span>` +
        `<span class="wt">${esc(fmtWeight(r.weight))} ${esc(ex.unit || "lb")}</span>` +
        `<span class="rp">× ${esc(r.targetReps)} reps</span></li>`).join("")}</ol>
      ${isPeak && max <= 0 ? `<p class="warn-note">${esc(ex.name)} has no max weight in the
        library, so every rung comes out at 0. Set one on the Library tab, or fill the
        weights in by hand.</p>` : ""}
    </div>
    <div class="fb-actions">
      <button class="primary" id="add-go">Add</button>
      <button id="add-cancel">Cancel</button>
    </div>
  </div>`;

  $("#add-seg").onclick = (e) => {
    const b = e.target.closest("[data-scheme]");
    if (!b || b.dataset.scheme === addDraft.scheme) return;
    addDraft.scheme = b.dataset.scheme;
    renderAddExercise();
  };
  // The preview redraws on every keystroke, so the fields have to hand focus and caret
  // back afterwards -- the same problem, and the same fix, as the week grid.
  $$("[data-add-field]").forEach((el) => {
    el.oninput = () => {
      const field = el.dataset.addField;
      // Weight is the one decimal field here -- a plate math like 137.5 needs the dot --
      // everything else (sets, reps) is whole digits only.
      let clean = field === "weight"
        ? el.value.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1")
        : el.value.replace(/\D+/g, "");
      if (clean !== el.value) el.value = clean;
      // Held as typed, clamped by planSets(), so clearing the box to retype it doesn't
      // snap to 1 under your fingers.
      addDraft[field] = clean;
      renderAddExercise();
    };
    el.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); commitAddExercise(); } };
  });
  $("#add-cancel").onclick = closeAddExercise;
  $("#add-go").onclick = commitAddExercise;

  if (wasFocused) {
    const el = document.querySelector(`[data-add-field="${CSS.escape(wasFocused)}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch { /* no range */ } }
  } else {
    $("#add-go").focus();
  }
}

function commitAddExercise() {
  const { date, exerciseId } = addDraft;
  closeAddExercise();
  addExercise(date, exerciseId, { ...addDraft });
}

// ---- Library ---------------------------------------------------------------
//
// The library is a strength table, not a list of defaults. One editable number per
// movement -- the one-rep max -- and everything else on the row is derived from it: the
// pip (2.5% of it) and, when the row is open, what that model says you would lift for
// two reps through twelve. Deriving rather than storing is the point. There is no way
// for a three-rep max to drift out of step with the single it came from, and no eleven
// extra boxes per movement to keep honest.
function renderLibrary() {
  const rows = sortedExercises();
  const usage = (id) => (state.doc.entries || []).filter((e) => e.exerciseId === id).length;
  return `<section class="panel">
    <h3>Exercise library</h3>
    <div class="lib-row" style="border-bottom:1px solid var(--border)">
      <span class="cr"></span>
      <span class="nm cap">Movement</span><span class="gp cap">Group</span>
      <span class="rp cap">Rep</span><span class="num cap">Max Wt</span>
      <span class="pip cap">Pip</span><span class="cap del-col"></span>
    </div>
    ${rows.map((e) => libRowHTML(e, usage(e.id))).join("")}
    <div class="lib-add">
      <input type="text" id="lib-new" placeholder="New movement — e.g. Front Squat" style="flex:2 1 12rem">
      <button class="primary" id="lib-add">Add</button>
    </div>
    <p class="hint"><strong>Max weight</strong> is the most you can lift for the number of
      <strong>reps</strong> next to it — leave reps at 1 if it's a genuine one-rep max.
      Everything else on the row is worked back from those two numbers: a
      <strong>pip</strong> is 2.5% of the one-rep max they imply, and opening a row shows
      the rep maxes that follow from it, one pip lighter per rep. Reps past 12 are priced
      the same as 12 — the model doesn't extrapolate a curve that far, so a 20-rep set is
      just entered as 20 and treated like a 12-rep one for the math. New sets on a day
      still start from the last session you did that movement — max weight only seeds a
      movement with no history yet. Deleting a movement leaves sessions that already used
      it untouched: the name is copied onto each one when it's added to a day.</p>
  </section>`;
}

function libRowHTML(e, used) {
  const open = state.libExpanded.has(e.id);
  const g = groupOf(e);
  return `<div class="lib-row${open ? " open" : ""}" data-ex="${esc(e.id)}">
    <button class="small cr" data-ex-toggle="${esc(e.id)}"
            title="${open ? "Hide" : "Show"} rep maxes and notes">${open ? "▾" : "▸"}</button>
    <input class="nm" type="text" data-fkey="ex-name:${esc(e.id)}" data-ex-name="${esc(e.id)}" value="${esc(e.name)}">
    <select class="gp mg" style="${groupStyle(g)}" data-ex-group="${esc(e.id)}" title="Muscle group">
      <option value=""${g ? "" : " selected"}>— group</option>
      ${MUSCLE_GROUPS.map((m) =>
        `<option value="${m.id}"${m.id === g?.id ? " selected" : ""}>${esc(m.label)}</option>`).join("")}
    </select>
    <input class="rp" type="text" inputmode="numeric" maxlength="2" data-fkey="ex-maxreps:${esc(e.id)}"
           data-ex-maxreps="${esc(e.id)}" value="${esc(e.maxReps ?? 1)}"
           title="How many reps Max Weight is good for — 1 if it's a genuine one-rep max. Past 12, it's priced the same as a 12-rep max.">
    <input class="num" type="text" inputmode="decimal" data-fkey="ex-max:${esc(e.id)}"
           data-ex-max="${esc(e.id)}" value="${esc(fmtWeight(e.defaultWeight))}"
           title="The most you can lift for the Reps count on this row">
    <span class="pip" data-ex-pip="${esc(e.id)}" title="One pip = 2.5% of the estimated one-rep max">${esc(fmtPip(estimatedOneRepMax(e)))}</span>
    <button class="small ghost danger ex-del" data-ex-del="${esc(e.id)}"
            title="${used ? `Delete ${e.name} — used on ${used} day(s)` : `Delete ${e.name}`}"
            aria-label="Delete ${esc(e.name)}">×</button>
    ${open ? `<div class="lib-reps" data-ex-reps="${esc(e.id)}">${repMaxHTML(e)}</div>
      <div class="lib-notes-wrap">
        <label class="field">Notes
          <textarea class="lib-notes" rows="2" data-fkey="ex-notes:${esc(e.id)}"
                    data-ex-notes="${esc(e.id)}"
                    placeholder="Form cues, technique notes…">${esc(e.notes || "")}</textarea>
        </label>
      </div>` : ""}
  </div>`;
}

// The 2..12 rep maxes for one movement. Twelve rows of arithmetic is more than a glance
// wants as a table, so they are chips that reflow to however many fit the width.
function repMaxHTML(e) {
  const oneRM = estimatedOneRepMax(e);
  const unit = e.unit || "lb";
  if (oneRM <= 0) {
    return `<p class="note">Set a max weight to see the rep maxes it implies.</p>`;
  }
  const cells = [];
  for (let reps = 2; reps <= REP_MAX_MAX; reps++) {
    cells.push(`<div class="rm"><span class="n">${reps} reps</span>` +
      `<span class="w">${esc(fmtWeight(repMaxWeight(oneRM, reps)))}</span>` +
      `<span class="u">${esc(unit)}</span></div>`);
  }
  // States the rule rather than working an example: the displayed pip is rounded to one
  // decimal to match the column, so any sum spelled out here ("3.4 x 12") would land a
  // few tenths off the exact figures in the chips below and read as a bug.
  const reps = num(e.maxReps, 1);
  const basis = reps > 1
    ? `an estimated ${esc(fmtWeight(oneRM))} ${esc(unit)} one-rep max` +
      (reps > REP_MAX_MAX ? ` (priced as a ${REP_MAX_MAX}-rep max — ${reps} isn't modeled further)` : "")
    : `a ${esc(fmtWeight(oneRM))} ${esc(unit)} single`;
  return `<p class="note">1 pip = ${esc(fmtPip(oneRM))} ${esc(unit)} · one pip lighter per rep, ` +
    `off ${basis}.</p>` + cells.join("");
}

function wireLibrary() {
  const field = (attr, key, parse) => $$(`[data-ex-${attr}]`).forEach((el) => {
    const id = el.dataset["ex" + attr[0].toUpperCase() + attr.slice(1)];
    const commit = () => patch("exercises", id, { [key]: parse(el.value) });
    if (el.tagName === "SELECT") { el.onchange = commit; return; }
    el.oninput = () => saveLater(`${attr}:${id}`, commit);
    el.onchange = () => { flushSaves(); commit(); };
  });
  field("name", "name", (v) => v.trim() || "Untitled");
  field("group", "muscleGroup", (v) => v);
  // Reps itself isn't capped at REP_MAX_MAX (12) -- a set of 20 bodyweight squats is a
  // real data point. estimatedOneRepMax() is what caps the *model* at 12 reps' worth of
  // discount, so a 20-rep entry prices the same as a 12-rep one instead of extrapolating
  // the pip formula out to an ever-lighter, eventually negative, weight.
  field("maxreps", "maxReps", (v) => Math.max(1, Math.min(MAX_REPS, num(v, 1))));
  field("max", "defaultWeight", (v) => num(v, 0));
  field("notes", "notes", (v) => v);

  // The pip and the rep maxes are read off Max Weight and Reps together, and the save
  // that would redraw them is debounced by 600ms -- long enough for a column to sit
  // visibly wrong while you type into the box next to it. So they are refreshed on the
  // keystroke, straight into the DOM, rather than waiting for the round trip to bring
  // them back. Both fields feed the same estimate, so both get the same live refresh.
  const refreshDerived = (id, patchEx) => {
    const ex = { ...exerciseById(id), ...patchEx };
    const oneRM = estimatedOneRepMax(ex);
    const pip = document.querySelector(`[data-ex-pip="${CSS.escape(id)}"]`);
    if (pip) pip.textContent = fmtPip(oneRM);
    const reps = document.querySelector(`[data-ex-reps="${CSS.escape(id)}"]`);
    if (reps) reps.innerHTML = repMaxHTML(ex);
  };
  $$("[data-ex-max]").forEach((el) => {
    const id = el.dataset.exMax;
    const typed = el.oninput;
    el.oninput = (ev) => { typed(ev); refreshDerived(id, { defaultWeight: num(el.value, 0) }); };
  });
  $$("[data-ex-maxreps]").forEach((el) => {
    const id = el.dataset.exMaxreps;
    const typed = el.oninput;
    el.oninput = (ev) => {
      typed(ev);
      refreshDerived(id, { maxReps: Math.max(1, Math.min(MAX_REPS, num(el.value, 1))) });
    };
  });

  // Colour the chip the moment the group changes, for the same reason: the select's own
  // change handler saves, and the redraw that recolours it is a network round trip away.
  $$("[data-ex-group]").forEach((el) => {
    const saved = el.onchange;
    el.onchange = (ev) => {
      el.setAttribute("style", groupStyle(GROUP_BY_ID.get(el.value) || null));
      saved(ev);
    };
  });

  $$("[data-ex-toggle]").forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.exToggle;
      if (state.libExpanded.has(id)) state.libExpanded.delete(id);
      else state.libExpanded.add(id);
      render();
    };
  });

  $$("[data-ex-del]").forEach((el) => {
    el.onclick = () => {
      const ex = exerciseById(el.dataset.exDel);
      if (ex && confirm(`Delete ${ex.name} from the library? Sessions that used it stay.`)) {
        state.libExpanded.delete(ex.id);
        remove("exercises", ex.id);
      }
    };
  });
  const add = () => {
    const input = $("#lib-new");
    if (newExercise(input.value)) input.value = "";
    input.focus();
  };
  $("#lib-add").onclick = add;
  $("#lib-new").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
}

// ---- Program -----------------------------------------------------------------
function renderProgram() {
  const prog = activeProgram();
  return prog ? renderActiveProgram(prog) : renderProgramCatalog();
}

function renderProgramCatalog() {
  return `<div>${Object.values(PROGRAMS).map((def) => `
    <section class="panel" style="margin-bottom:.6rem">
      <h3>${esc(def.name)}</h3>
      <p class="hint" style="margin-top:0">${esc(def.blurb)}</p>
      <p class="hint">${def.weeks} weeks · ${def.days.length} lift days a week</p>
      <button class="primary" data-prog-setup="${esc(def.id)}">Start this program</button>
    </section>`).join("")}
  </div>`;
}

function renderActiveProgram(prog) {
  const def = programDef(prog);
  return `<section class="panel">
    <h3>${esc(def.name)}</h3>
    <p class="hint" style="margin-top:0">${esc(def.blurb)}</p>
    <p>Week <strong>${prog.weeksGenerated}</strong> of ${def.weeks}${prog.status === "completed" ? " — complete" : ""}
       · started ${esc(fmtDate(prog.startDate))}</p>
    ${prog.conflicts?.length ? `<p class="warn-note">${prog.conflicts.length}
       conflict${prog.conflicts.length === 1 ? "" : "s"} — existing data was never
       overwritten, just left as is:</p>
       <ul class="hint" style="margin:0 0 .5rem 1.2rem">
         ${prog.conflicts.map((c) => `<li>${esc(c)}</li>`).join("")}
       </ul>` : ""}
    <div class="prog-slots">
      ${def.days.map((day) => `<div class="prog-day">
        <div class="prog-day-label">${esc(DOW[day.dow])}</div>
        ${day.slots.map((slot) => slotOverrideRowHTML(prog, slot)).join("")}
      </div>`).join("")}
    </div>
    <p class="hint">Adjusting a weight here only changes weeks not yet generated —
      weeks already written to your log are real logged sets, same as anything you'd
      type by hand, and this doesn't touch them.</p>
    ${prog.status === "active"
      ? `<button class="ghost danger" data-prog-cancel="${esc(prog.id)}">Cancel program</button>`
      : ""}
  </section>`;
}

function slotOverrideRowHTML(prog, slot) {
  const ex = programResolveExercise(slot.exercise);
  const isPeak = slot.scheme === "peak";
  const fallback = ex ? (isPeak ? estimatedOneRepMax(ex) : num(ex.defaultWeight, 0)) : 0;
  const val = prog.overrides?.[slot.id] ?? fallback;
  return `<div class="prog-slot">
    <span class="prog-slot-ex">${esc(slot.exercise)}${isPeak ? ' <span class="scheme">Peak</span>' : ""}</span>
    <input class="prog-slot-w" type="text" inputmode="decimal" data-prog-override="${esc(slot.id)}"
           data-prog-id="${esc(prog.id)}" data-fkey="prog-ov:${esc(slot.id)}"
           value="${esc(fmtWeight(val))}"
           title="${isPeak ? "One-rep max this program prices its weeks off" : "Starting weight"}">
    <span class="unit">${esc(ex?.unit || "lb")}</span>
  </div>`;
}

function wireProgram() {
  $$("[data-prog-setup]").forEach((el) => { el.onclick = () => openProgramSetup(el.dataset.progSetup); });
  $$("[data-prog-cancel]").forEach((el) => {
    el.onclick = () => {
      if (confirm("Cancel this program? Weeks already generated stay in your log -- " +
          "this only stops new ones from being created.")) {
        patch("programs", el.dataset.progCancel, { status: "cancelled" });
      }
    };
  });
  $$("[data-prog-override]").forEach((el) => {
    const slotId = el.dataset.progOverride, progId = el.dataset.progId;
    const commit = () => {
      const prog = (state.doc.programs || []).find((p) => p.id === progId);
      if (!prog) return;
      patch("programs", progId, { overrides: { ...(prog.overrides || {}), [slotId]: num(el.value, 0) } });
    };
    el.oninput = () => saveLater(`prog-ov:${slotId}`, commit);
    el.onchange = () => { flushSaves(); commit(); };
  });
}

// ---- Program setup dialog ------------------------------------------------------
const programDraft = { programId: null, overrides: {} };

function openProgramSetup(programId) {
  const def = PROGRAMS[programId];
  if (!def || activeProgram()) return;
  programDraft.programId = programId;
  programDraft.overrides = {};
  def.days.forEach((day) => day.slots.forEach((slot) => {
    const ex = programResolveExercise(slot.exercise);
    const val = ex ? (slot.scheme === "peak" ? estimatedOneRepMax(ex) : num(ex.defaultWeight, 0)) : 0;
    programDraft.overrides[slot.id] = fmtWeight(val);
  }));
  renderProgramSetup();
}

function closeProgramSetup() {
  const modal = $("#program-modal");
  modal.hidden = true;
  modal.innerHTML = "";
}

function renderProgramSetup() {
  const def = PROGRAMS[programDraft.programId];
  if (!def) return closeProgramSetup();
  const modal = $("#program-modal");
  const wasFocused = document.activeElement?.dataset?.progDraft;
  const caret = document.activeElement?.selectionStart;

  modal.hidden = false;
  modal.innerHTML = `<div class="fb-box" style="width:min(480px,100%)">
    <h3>Start ${esc(def.name)}</h3>
    <p style="font-size:.75rem;color:var(--muted);margin:.1rem 0 .5rem">
      Starting weights come from the Library by default — adjust any below. Week 1
      begins ${esc(fmtDate(weekStartOf(todayISO())))}.</p>
    <div class="prog-slots">
      ${def.days.map((day) => `<div class="prog-day">
        <div class="prog-day-label">${esc(DOW[day.dow])}</div>
        ${day.slots.map((slot) => {
          const ex = programResolveExercise(slot.exercise);
          const isPeak = slot.scheme === "peak";
          return `<div class="prog-slot">
            <span class="prog-slot-ex">${esc(slot.exercise)}${isPeak ? ' <span class="scheme">Peak</span>' : ""}
              ${!ex ? '<span class="warn-note">not in Library — this slot will be skipped</span>' : ""}</span>
            <input class="prog-slot-w" type="text" inputmode="decimal" data-prog-draft="${esc(slot.id)}"
                   data-fkey="prog-draft:${esc(slot.id)}" value="${esc(programDraft.overrides[slot.id] ?? "")}">
            <span class="unit">${esc(ex?.unit || "lb")}</span>
          </div>`;
        }).join("")}
      </div>`).join("")}
    </div>
    <div class="fb-actions">
      <button class="primary" id="prog-activate">Activate</button>
      <button id="prog-setup-cancel">Cancel</button>
    </div>
  </div>`;

  $$("[data-prog-draft]").forEach((el) => {
    el.oninput = () => { programDraft.overrides[el.dataset.progDraft] = el.value; };
  });
  $("#prog-setup-cancel").onclick = closeProgramSetup;
  $("#prog-activate").onclick = () => {
    const overrides = {};
    for (const [slotId, v] of Object.entries(programDraft.overrides)) overrides[slotId] = num(v, 0);
    const programId = programDraft.programId;
    closeProgramSetup();
    activateProgram(programId, overrides);
  };

  if (wasFocused) {
    const el = document.querySelector(`[data-prog-draft="${CSS.escape(wasFocused)}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch { /* no range */ } }
  }
}

// ===========================================================================
// Navigation and global wiring
// ===========================================================================
function setView(view) {
  if (!VIEWS.some((v) => v.id === view)) view = "week";
  state.view = view;
  localStorage.setItem("lt.view", view);
  if (location.hash.slice(1) !== view) location.hash = view;
  render();
}

function shiftWeek(n) {
  state.weekStart = addDays(state.weekStart, n * 7);
  render();
}

function wireGlobal() {
  $("#tabs").onclick = (e) => {
    const b = e.target.closest("[data-view]");
    if (b) setView(b.dataset.view);
  };
  $("#wk-prev").onclick = () => shiftWeek(-1);
  $("#wk-next").onclick = () => shiftWeek(1);
  $("#wk-today").onclick = () => { state.weekStart = weekStartOf(todayISO()); render(); };
  $("#btn-feedback").onclick = openFeedback;

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeFeedback(); closeAddExercise(); closeProgramSetup(); return; }
    // Shortcuts must never fire while someone is typing a weight into a box, or while a
    // dialog is up -- "f" over the add-exercise dialog would stack the feedback form on
    // top of a decision that hasn't been taken yet.
    // matches?. rather than matches: a keydown with nothing focused targets the document,
    // which is not an Element and has no matches() to call.
    if (e.target.matches?.("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$("#add-modal").hidden || !$("#fb-modal").hidden || !$("#program-modal").hidden) return;
    if (e.key === "f") { e.preventDefault(); openFeedback(); }
    else if (e.key === "[" && state.view === "week") shiftWeek(-1);
    else if (e.key === "]" && state.view === "week") shiftWeek(1);
  });
}

// ===========================================================================
// Feedback capture
//
// Posts to this repo's Lift Tracker Feedback Desk (feedback-desk/, port 8441) running on the same
// machine as this app's own server. The value isn't the form — it's the context block
// attached to it. "The weights are wrong" is close to unactionable; the same sentence
// with the week on screen, which rows were expanded, the data revision and any
// JavaScript errors that had fired is usually enough to reproduce from. Nobody types
// that by hand, so the page does.
//
// The desk is optional: if it isn't running, the report is handed back as markdown to
// paste somewhere rather than being lost.
// ===========================================================================
const FEEDBACK_PORT = 8441;
const feedbackUrl = () => `${location.protocol}//${location.hostname}:${FEEDBACK_PORT}`;

// A short ring buffer of anything the page threw. Registered at parse time, before boot()
// runs, so an error during startup is still caught.
const recentErrors = [];
const noteError = (kind, detail) => {
  recentErrors.push({ kind, detail: String(detail).slice(0, 400), at: new Date().toISOString() });
  if (recentErrors.length > 10) recentErrors.shift();
};
window.addEventListener("error", (e) =>
  noteError("error", `${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`));
window.addEventListener("unhandledrejection", (e) =>
  noteError("unhandledrejection", e.reason?.message || e.reason));

function feedbackContext() {
  const dates = state.weekStart ? weekDates(state.weekStart) : [];
  return {
    source: "lift-tracker",
    capturedAt: new Date().toISOString(),
    url: location.href,
    view: state.view,
    weekStart: state.weekStart,
    weekTypes: dates.map((d) => `${d}:${dayType(d)}`),
    expandedEntries: [...state.expanded],
    viewport: `${window.innerWidth}x${window.innerHeight}`,
    userAgent: navigator.userAgent,
    appRev: state.rev,
    counts: {
      exercises: (state.doc?.exercises || []).length,
      days: (state.doc?.days || []).length,
      entries: (state.doc?.entries || []).length,
      sets: (state.doc?.sets || []).length,
    },
    errors: recentErrors.slice(),
  };
}

function openFeedback() {
  const ctx = feedbackContext();
  const modal = $("#fb-modal");
  modal.hidden = false;
  modal.innerHTML = `<div class="fb-box">
    <h3>Report something about Lift Tracker</h3>
    <p style="font-size:.75rem;color:var(--muted);margin:.1rem 0 0">
      Goes to the Lift Tracker Feedback Desk, with what you were looking at attached.</p>
    <div class="fb-grid">
      <label class="field">Type<select id="fb-type">
        ${[["bug", "bug"], ["feature", "new feature"], ["polish", "polish"], ["question", "question"]]
          .map(([v, label]) => `<option value="${v}">${label}</option>`).join("")}</select></label>
      <label class="field">Severity<select id="fb-sev">
        ${["high", "low"].map((v) =>
          `<option value="${v}"${v === "low" ? " selected" : ""}>${v}</option>`).join("")}</select></label>
    </div>
    <label class="field">Title
      <input type="text" id="fb-title" placeholder="One line — the thing itself"></label>
    <label class="field" style="margin-top:.45rem">What happened
      <textarea id="fb-what" rows="3" placeholder="What you saw."></textarea></label>
    <label class="field" style="margin-top:.45rem">What you expected (optional)
      <textarea id="fb-expected" rows="2"></textarea></label>
    <div class="fb-ctx">attaching: ${esc(JSON.stringify(ctx, null, 1).slice(0, 600))}</div>
    <div class="fb-actions">
      <button class="primary" id="fb-send">Send</button>
      <button id="fb-cancel">Cancel</button>
      <span id="fb-msg" style="font-size:.75rem;color:var(--muted)"></span>
    </div>
  </div>`;
  $("#fb-cancel").onclick = closeFeedback;
  $("#fb-send").onclick = () => sendFeedback(ctx);
  $("#fb-title").focus();
  $("#fb-title").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendFeedback(ctx); }
  });
}

function closeFeedback() { $("#fb-modal").hidden = true; }

async function sendFeedback(ctx) {
  const title = $("#fb-title").value.trim();
  if (!title) { $("#fb-msg").textContent = "A title is required."; $("#fb-title").focus(); return; }
  const payload = {
    title, app: "lift-tracker",
    // The current view is the most accurate "area" available and costs the reporter
    // nothing; it's editable later in the desk.
    area: state.view,
    type: $("#fb-type").value, severity: $("#fb-sev").value,
    what: $("#fb-what").value, expected: $("#fb-expected").value,
    context: ctx,
  };
  $("#fb-msg").textContent = "Sending…";
  try {
    const res = await fetch(feedbackUrl() + "/api/capture", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error || "HTTP " + res.status);
    $("#fb-msg").textContent = `Captured ${body.item.id}.`;
    setTimeout(closeFeedback, 900);
  } catch (e) {
    // Never lose what someone took the trouble to write: hand it back as the markdown the
    // desk would have stored, ready to paste into the desk later or straight to Claude.
    const md = [`### ${title}`, "", `- app: lift-tracker / ${payload.area}`,
      `- type: ${payload.type} · severity: ${payload.severity}`, "",
      "**What happened**", payload.what || "—", "",
      "**Expected**", payload.expected || "—", "",
      "**Context**", "```json", JSON.stringify(ctx, null, 2), "```"].join("\n");
    $("#fb-modal").innerHTML = `<div class="fb-box">
      <h3>Couldn't reach the Lift Tracker Feedback Desk</h3>
      <p style="font-size:.78rem;color:var(--muted)">${esc(e.message)} — is it running?
        <code>./feedback-desk/server/start-server.sh</code><br>
        Here's your report; copy it so it isn't lost.</p>
      <textarea rows="12" id="fb-fallback" style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:.72rem">${esc(md)}</textarea>
      <div class="fb-actions"><button class="primary" id="fb-close2">Close</button></div>
    </div>`;
    $("#fb-close2").onclick = closeFeedback;
    $("#fb-fallback").select();
  }
}

// ===========================================================================
// Boot
// ===========================================================================
async function boot() {
  state.weekStart = weekStartOf(todayISO());
  const wanted = location.hash.slice(1) || localStorage.getItem("lt.view");
  if (VIEWS.some((v) => v.id === wanted)) state.view = wanted;
  window.addEventListener("hashchange", () => setView(location.hash.slice(1)));
  wireGlobal();
  try {
    const ping = await apiGet("/api/ping");
    if (!ping || ping.server !== "lift-tracker") throw new Error("unexpected server");
    await loadState();
    state.online = true;
    setPill("ok", "Connected");
    setView(state.view);
    maybeAdvanceProgram();
  } catch (e) {
    setPill("bad", "No server");
    $("#weekbar").hidden = true;
    $("#view").innerHTML = `<div class="empty">
      <p><strong>Can't reach the Lift Tracker server.</strong></p>
      <p>This page needs it — it's where the shared training log lives. On the machine
         holding the data, run:</p>
      <p><code>./server/start-server.sh</code></p>
      <p>then open the address it prints from any device on the same WiFi.</p>
      <p style="color:var(--faint);font-size:.8rem">(${esc(e.message)})</p></div>`;
  }
  setInterval(poll, 4000);
}

boot();
</script>
</body>
